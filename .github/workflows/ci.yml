name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Workflow & runtime guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node --test .github/scripts/ci-guard.test.mjs
      - run: node .github/scripts/ci-guard.mjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  lint:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check

  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: mkdir -p .reports && npm run test -w backend -- --reporter=default --reporter=junit --outputFile=../.reports/backend.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-test-results
          path: app/.reports/backend.xml
          include-hidden-files: true
          retention-days: 7

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: mkdir -p .reports && npm run test -w frontend -- --reporter=default --reporter=junit --outputFile=../.reports/frontend.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-test-results
          path: app/.reports/frontend.xml
          include-hidden-files: true
          retention-days: 7

  go-quality:
    name: Go lint, vet & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - run: make lint
      - run: go vet ./...
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go mod verify
      - run: go build ./...

  go-tests:
    name: Go unit tests (race)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-agent-skill
      - run: go test -race -timeout 5m ./...

  mysql:
    name: MySQL migrations & isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-disposable-password
          MYSQL_DATABASE: axiocred_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-disposable-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MYSQL_URL: mysql://root:ci-only-disposable-password@127.0.0.1:3306/axiocred_ci
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Fresh schema and repeatable migration
        run: npm run migrate -w backend && npm run migrate -w backend
      - name: History, workspace FKs, retry safety and rollback
        run: node --import tsx scripts/verify-evidence-index.mjs

  container:
    name: Application & container build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build exact deployment context
        run: docker build -t axiocred-ci:${{ github.sha }} app
      - name: Runtime artifacts and non-root user
        run: |
          test "$(docker inspect --format '{{.Config.User}}' axiocred-ci:${{ github.sha }})" = node
          docker run --rm --entrypoint sh axiocred-ci:${{ github.sha }} -c 'test -f backend/dist/server.js && test -f backend/sql/002_evidence_index.sql && test -f frontend/dist/index.html && test ! -f .env && test ! -d .dev'

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check semgrep==1.176.1
      - name: Test application security rules against unsafe fixtures
        run: semgrep --test --config .semgrep.yml .github/semgrep-tests
      - name: Community and application-specific security rules
        run: semgrep scan --config p/ci --config .semgrep.yml --metrics=off --error --sarif-output=semgrep.sarif app/backend/src app/frontend/src gmaps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-results
          path: semgrep.sarif
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks CLI release
        run: |
          curl --fail --location --retry 3 --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --retry 3 --output /tmp/gitleaks-checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          expected=$(awk '$2=="gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' /tmp/gitleaks-checksums.txt)
          test -n "$expected"
          printf '%s  /tmp/gitleaks.tar.gz\n' "$expected" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan proposed commits (redacted)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BASE_SHA" =~ ^0+$ ]]; then
            /tmp/gitleaks git --log-opts="$BASE_SHA..HEAD" --redact --report-format=sarif --report-path=gitleaks.sarif
          else
            /tmp/gitleaks dir --redact --report-format=sarif --report-path=gitleaks.sarif
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: secret-scan-results
          path: gitleaks.sarif
          retention-days: 7

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm audit --audit-level=high
        working-directory: app
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vuln

  required:
    name: Required checks
    if: always()
    needs: [guard, lint, backend, frontend, go-quality, go-tests, mysql, container, semgrep, secrets, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject failed, cancelled or skipped requirements
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e 'import {checkRequiredResults} from "./.github/scripts/ci-guard.mjs";const r=JSON.parse(process.env.RESULTS);if(!checkRequiredResults(r)){console.error(JSON.stringify(r));process.exit(1);}console.log("All required checks passed.");'
