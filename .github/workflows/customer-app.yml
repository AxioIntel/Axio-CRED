name: customer-app

on:
  push:
    paths: ['app/**', 'gmaps/**', '.github/workflows/customer-app.yml']
  pull_request:
    paths: ['app/**', 'gmaps/**', '.github/workflows/customer-app.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: docker build -t axiocred-mvp .
