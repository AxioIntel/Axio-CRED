rules:
  - id: axiocred-no-disabled-tls
    languages: [javascript, typescript]
    severity: ERROR
    message: Never disable certificate validation for provider requests.
    pattern-either:
      - pattern: 'process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"'
      - pattern: '{..., rejectUnauthorized: false, ...}'
  - id: axiocred-no-dynamic-code
    languages: [javascript, typescript]
    severity: ERROR
    message: Do not execute dynamic JavaScript from collected or user-controlled data.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
  - id: axiocred-no-secret-response
    languages: [javascript, typescript]
    severity: ERROR
    message: Return readiness flags, not environment variables or provider secrets.
    pattern-either:
      - pattern: $RES.json(process.env)
      - pattern: $RES.send(process.env)
      - pattern: console.log(process.env)
  - id: axiocred-no-shell-execution
    languages: [javascript, typescript]
    severity: ERROR
    message: Spawn a fixed executable with an argument array; do not enable shell parsing.
    patterns:
      - pattern-either:
          - pattern: spawn($CMD, $ARGS, {..., shell: true, ...})
          - pattern: spawnSync($CMD, $ARGS, {..., shell: true, ...})
